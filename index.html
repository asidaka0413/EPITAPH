<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホで、画面の幅に合わせて表示する(これがないと、パソコン用の広い画面を縮めて表示してしまう)
     viewport-fit=cover:iPhone で、style.css の env(safe-area-inset-bottom)(画面下のバーをよける余白)を効かせるために要る -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 「ホーム画面に追加」したとき、アプリのように全画面で開く。名前は EPITAPH、上の時計などの帯は黒 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EPITAPH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0c0c10">
<title>EPITAPH</title>
<!-- ?v=… の数字:上げ直したとき、ブラウザが古いファイルを使い回さないようにする目印。
     ファイルを上げ直すときは、このファイルの中の「?v=」の数字を全部その日の日付に書きかえる(置換でまとめてやるとよい) -->
<link rel="stylesheet" href="style.css?v=20261004">
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="panel">
      <div class="panel-title" id="screen-title"></div>
      <div id="screen"></div>
    </div>
    <div class="panel" id="status-panel">
      <div id="status"></div>
    </div>
    <div id="hint"></div>
  </div>
  <div class="side">
    <div class="panel" id="equip-panel">
      <div class="panel-title">装備</div>
      <div id="equip"></div>
    </div>
    <div class="panel" id="quest-panel">
      <div class="panel-title">依頼 <span id="gold" class="gold"></span></div>
      <div id="quests"></div>
    </div>
    <div class="panel">
      <div class="panel-title">ログ</div>
      <div id="log"></div>
    </div>
    <div class="panel">
      <div class="panel-title">設定</div>
      <div class="setting-row">
        <span>拾ったとき、空いている枠に自動で装備</span>
        <button id="auto-equip-btn" class="toggle" onclick="toggleAutoEquip(); this.blur();"></button>
      </div>
    </div>
    <div class="panel debug-panel" id="debug-panel">
      <div class="panel-title">デバッグ(拠点の設定で OFF にできます)</div>
      <div id="debug"></div>
    </div>
  </div>
</div>
<!-- スマホ:右上の [≡] で右の列(引き出し)を開け閉めする。うしろの暗い幕をタップしても閉じる(js/touch.js の toggleSideDrawer) -->
<button id="side-toggle" onclick="toggleSideDrawer(); this.blur();">≡</button>
<div id="side-backdrop" onclick="toggleSideDrawer(false)"></div>
<!-- マップにマウスを合わせたときに出す詳細ウィンドウ(中身は js/tooltip.js で入れる) -->
<div id="tooltip"></div>
<!-- データ(敵・装備・書・効果・一族を増やすときは data/ の中のファイルを書き換える) -->
<script src="data/equipment.js?v=20261004"></script>
<script src="data/monsters.js?v=20261004"></script>
<script src="data/books.js?v=20261004"></script>
<script src="data/effects.js?v=20261004"></script>
<script src="data/sets.js?v=20261004"></script>
<script src="data/elements.js?v=20261004"></script>
<script src="data/help.js?v=20261004"></script>
<script src="data/achievements.js?v=20261004"></script>
<!-- プログラム(この順番で読み込む。後のファイルは前のファイルの関数や変数を使う) -->
<script src="js/config.js?v=20261004"></script>
<script src="js/util.js?v=20261004"></script>
<script src="js/state.js?v=20261004"></script>
<script src="js/sound.js?v=20261004"></script>
<script src="js/bgm.js?v=20261004"></script>
<script src="js/stats.js?v=20261004"></script>
<script src="js/items.js?v=20261004"></script>
<script src="js/dungeon.js?v=20261004"></script>
<script src="js/treasure.js?v=20261004"></script>
<script src="js/treasuremap.js?v=20261004"></script>
<script src="js/hazard.js?v=20261004"></script>
<script src="js/grave.js?v=20261004"></script>
<script src="js/elite.js?v=20261004"></script>
<script src="js/route.js?v=20261004"></script>
<script src="js/camp.js?v=20261004"></script>
<script src="js/enemies.js?v=20261004"></script>
<script src="js/enemyskills.js?v=20261004"></script>
<script src="js/ailments.js?v=20261004"></script>
<script src="js/combat.js?v=20261004"></script>
<script src="js/screens.js?v=20261004"></script>
<script src="js/townscreens.js?v=20261004"></script>
<script src="js/town.js?v=20261004"></script>
<script src="js/quests.js?v=20261004"></script>
<script src="js/shop.js?v=20261004"></script>
<script src="js/smithy.js?v=20261004"></script>
<script src="js/achievements.js?v=20261004"></script>
<script src="js/debug.js?v=20261004"></script>
<script src="js/tooltip.js?v=20261004"></script>
<script src="js/touch.js?v=20261004"></script>
<script src="js/input.js?v=20261004"></script>
</body>
</html>
